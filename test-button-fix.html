<!DOCTYPE html>
<html>
<head>
    <title>Button Fix Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .test-button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .status { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px; background: #4CAF50; color: white; border-radius: 5px; }
        
        /* Copy exact styles from main app */
        .btn-login {
            background: none;
            border: 1px solid #ddd;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        
        .btn-login:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .test-results {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔧 Button Fix Test</h1>
    
    <div class="test-section">
        <h2>🧪 Test Button Fix</h2>
        
        <div class="status">
            <h3>✅ Status: Testing Button Fix</h3>
            <p>Checking if login button is found and working...</p>
        </div>
        
        <h2>🧪 Test Functions</h2>
        
        <button class="test-button" onclick="testButtonExists()">1. Test Button Exists</button>
        <button class="test-button" onclick="testButtonClass()">2. Test Button Class</button>
        <button class="test-button" onclick="testButtonOnclick()">3. Test Button Onclick</button>
        <button class="test-button" onclick="testModalExists()">4. Test Modal Exists</button>
        
        <div id="testResults" class="test-results">
            <h3>📊 Test Results:</h3>
            <div id="results">Click test buttons to see results</div>
        </div>
    </div>
    
    <!-- Simple Login/Signup Modal -->
    <div id="loginSignupModal" class="auth-modal hidden">
        <div class="auth-card">
            <button class="auth-close" onclick="closeLoginSignup()">×</button>

            <!-- Signup -->
            <input id="signupName" type="text" placeholder="Full Name">
            <input id="signupEmail" type="email" placeholder="Email">
            <input id="signupPassword" type="password" placeholder="Password">
            <button onclick="handleSignup()">Create Account</button>

            <hr>

            <!-- Login -->
            <input id="loginEmail" type="email" placeholder="Email">
            <input id="loginPassword" type="password" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
        </div>
    </div>
    
    <script>
        var supabaseClient;
        let currentSession = null;
        let currentUser = null;
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification' + (type === 'error' ? ' error' : '');
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 3000);
        }
        
        function testButtonExists() {
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                testResults.innerHTML = `
                    <div class="success">✅ Button Found</div>
                    <p>Button exists: Yes</p>
                    <p>Button class: ${loginBtn.className}</p>
                    <p>Button text: ${loginBtn.innerHTML}</p>
                    <p>Button onclick: ${loginBtn.onclick ? 'Set' : 'Not set'}</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>Button with .btn-login class not found</p>
                `;
            }
        }
        
        function testButtonClass() {
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                const hasCorrectClass = loginBtn.classList.contains('btn-login');
                testResults.innerHTML = `
                    <div class="success">✅ Button Class Test</div>
                    <p>Has btn-login class: ${hasCorrectClass ? 'Yes' : 'No'}</p>
                    <p>All classes: ${loginBtn.className}</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>Cannot test class</p>
                `;
            }
        }
        
        function testButtonOnclick() {
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                testResults.innerHTML = `
                    <div class="success">✅ Button Onclick Test</div>
                    <p>Button onclick: ${loginBtn.onclick ? 'Set to function' : 'Not set'}</p>
                    <p>Function name: ${loginBtn.onclick ? loginBtn.onclick.name : 'None'}</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>Cannot test onclick</p>
                `;
            }
        }
        
        function testModalExists() {
            const testResults = document.getElementById('testResults');
            const modal = document.getElementById('loginSignupModal');
            
            if (modal) {
                testResults.innerHTML = `
                    <div class="success">✅ Modal Found</div>
                    <p>Modal exists: Yes</p>
                    <p>Modal ID: loginSignupModal</p>
                    <p>Modal class: ${modal.className}</p>
                    <p>Modal display: ${modal.style.display}</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Modal Not Found</div>
                    <p>Modal element not found</p>
                `;
            }
        }
        
        // Global functions for modal (outside DOMContentLoaded)
        window.openLoginSignup = function () {
            const modal = document.getElementById("loginSignupModal");
            if (!modal) {
                console.error("Login modal not found");
                return;
            }
            modal.classList.remove("hidden");
        };

        window.closeLoginSignup = function () {
            const modal = document.getElementById("loginSignupModal");
            if (!modal) return;
            modal.classList.add("hidden");
        };
        
        // Mock functions for testing
        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showNotification('Please enter email and password');
                return;
            }
            
            showNotification('Login test successful!');
            console.log('Login test passed:', { email, password: '***' });
        }
        
        function handleSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            
            if (!name || !email || !password) {
                showNotification('Please fill in all fields');
                return;
            }
            
            showNotification('Signup test successful!');
            console.log('Signup test passed:', { name, email, password: '***' });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 DOM Content Loaded');
            console.log('✅ Button fix test ready');
        });
    </script>
</body>
</html>
