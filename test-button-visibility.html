<!DOCTYPE html>
<html>
<head>
    <title>Button Visibility Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .test-button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .status { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px; background: #4CAF50; color: white; border-radius: 5px; }
        
        /* Copy exact styles from main app */
        .btn-login {
            background: none;
            border: 1px solid #ddd;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        
        .btn-login:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .test-results {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔧 Button Visibility Test</h1>
    
    <div class="test-section">
        <h2>🧪 Button Visibility Test</h2>
        
        <div class="status">
            <h3>✅ Status: Testing Button Visibility</h3>
            <p>Checking if login button appears consistently...</p>
        </div>
        
        <h2>🧪 Test Functions</h2>
        
        <button class="test-button" onclick="testButtonExists()">1. Test Button Exists</button>
        <button class="test-button" onclick="testButtonProperties()">2. Test Button Properties</button>
        <button class="test-button" onclick="testButtonVisibility()">3. Test Button Visibility</button>
        <button class="test-button" onclick="testComplete()">4. Test Complete</button>
        
        <div id="testResults" class="test-results">
            <h3>📊 Test Results:</h3>
            <div id="results">Click test buttons to see results</div>
        </div>
    </div>
    
    <script>
        var supabaseClient;
        let currentSession = null;
        let currentUser = null;
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification' + (type === 'error' ? ' error' : '');
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 3000);
        }
        
        function testButtonExists() {
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                testResults.innerHTML = `
                    <div class="success">✅ Button Exists</div>
                    <h4>🔍 Button Properties:</h4>
                    <p>✅ Button exists: Yes</p>
                    <p>✅ Button text: "${loginBtn.textContent}"</p>
                    <p>✅ Button class: "${loginBtn.className}"</p>
                    <p>✅ Button onclick: ${loginBtn.onclick ? 'Set to function' : 'Not set'}</p>
                    <p>✅ Button href: ${loginBtn.href || 'Not set'}</p>
                    <p>✅ Button parent: ${loginBtn.parentElement ? loginBtn.parentElement.tagName : 'Not set'}</p>
                    <p>✅ Button display: ${loginBtn.style.display}</p>
                    <p>✅ Button visibility: ${window.getComputedStyle(loginBtn).display}</p>
                    <h4>🎉 Expected:</h4>
                    <p>✅ Button should be visible and clickable</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>❌ Button with .btn-login class not found</p>
                `;
            }
        }
        
        function testButtonProperties() {
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                testResults.innerHTML = `
                    <div class="success">✅ Button Properties Test Results</div>
                    <h4>🔍 Button Properties:</h4>
                    <p>✅ Button exists: Yes</p>
                    <p>✅ Button text: "${loginBtn.textContent}"</p>
                    <p>✅ Button class: "${loginBtn.className}"</p>
                    <p>✅ Button onclick: ${loginBtn.onclick ? 'Set to function' : 'Not set'}</p>
                    <p>✅ Button href: ${loginBtn.href || 'Not set'}</p>
                    <p>✅ Button parent: ${loginBtn.parentElement ? loginBtn.parentElement.tagName : 'Not set'}</p>
                    <p>✅ Button display: ${loginBtn.style.display}</p>
                    <p>✅ Button visibility: ${window.getComputedStyle(loginBtn).display}</p>
                    <h4>🎉 Expected:</h4>
                    <p>✅ Button should be visible and clickable</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>❌ Button with .btn-login class not found</p>
                `;
            }
        }
        
        function testButtonVisibility() {
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                testResults.innerHTML = `
                    <div class="success">✅ Button Visibility Test Results</div>
                    <h4>🔍 Button Visibility:</h4>
                    <p>✅ Button exists: Yes</p>
                    <p>✅ Button display: ${loginBtn.style.display}</p>
                    <p>✅ Button visibility: ${window.getComputedStyle(loginBtn).display}</p>
                    <p>✅ Button computed style: ${window.getComputedStyle(loginBtn).cssText}</p>
                    <h4>🔍 Button parent element: ${loginBtn.parentElement ? loginBtn.parentElement.tagName : 'Not set'}</p>
                    <h4>🔍 Current time: ${new Date().toLocaleTimeString()}</h4>
                    <p>✅ Button should be visible: ${loginBtn.style.display !== 'none' ? 'Yes' : 'No'}</p>
                    <p>✅ Button should be clickable: ${loginBtn.onclick ? 'Yes' : 'No'}</p>
                    <h4>🎉 Expected:</h4>
                    <p>✅ Button should remain visible when logged out</p>
                    <p>✅ Button should appear when logged out</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>❌ Button with .btn-login class not found</p>
                `;
            }
        }
        
        function testComplete() {
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                testResults.innerHTML = `
                    <div class="success">🎉 Test Complete</div>
                    <h4>🔍 Overall Status:</h4>
                    <p>✅ Button exists: Yes</p>
                    <p>✅ Button is visible: ${loginBtn.style.display !== 'none' ? 'Yes' : 'No'}</p>
                    <p>✅ Button is clickable: ${loginBtn.onclick ? 'Yes' : 'No'}</p>
                    <p>✅ Button should persist: Yes</p>
                    <h4>🎉 Final Result:</h4>
                    <p>${loginBtn && loginBtn.style.display !== 'none' && loginBtn.onclick ? 
                        '✅ Button is working correctly!' : 
                        '❌ Button is not working properly'}</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>❌ Button with .btn-login class not found</p>
                `;
            }
        }
        
        // Global functions for modal (outside DOMContentLoaded)
        window.openLoginSignup = function () {
            const modal = document.getElementById("loginSignupModal");
            if (!modal) {
                console.error("Login modal not found");
                return;
            }
            modal.classList.remove("hidden");
        };

        window.closeLoginSignup = function () {
            const modal = document.getElementById("loginSignupModal");
            if (!modal) return;
            modal.classList.add("hidden");
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 DOM Content Loaded');
            console.log('✅ Button visibility test ready');
        });
    </script>
</body>
</html>
