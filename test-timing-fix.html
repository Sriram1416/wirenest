<!DOCTYPE html>
<html>
<head>
    <title>Timing Fix Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .test-button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .status { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px; background: #4CAF50; color: white; border-radius: 5px; }
        
        /* Profile Styles */
        .profile-button {
            background: none;
            border: 1px solid #ddd;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        
        .profile-button:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .profile-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            border: 2px solid #ddd;
        }
        
        .profile-email {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        
        .test-results {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>⏰ Timing Fix Test</h1>
    
    <div class="test-section">
        <h2>🧪 Test Profile Display Timing</h2>
        
        <div class="status">
            <h3>✅ Status: Testing DOM Timing</h3>
            <p>Checking if profile display works with proper timing...</p>
        </div>
        
        <h2>🧪 Test Functions</h2>
        
        <button class="test-button" onclick="testDOMReady()">1. Test DOM Ready</button>
        <button class="test-button" onclick="testImmediateUpdate()">2. Test Immediate Update</button>
        <button class="test-button" onclick="testDelayedUpdate()">3. Test Delayed Update</button>
        <button class="test-button" onclick="testButtonStatus()">4. Test Button Status</button>
        
        <div id="testResults" class="test-results">
            <h3>📊 Test Results:</h3>
            <div id="results">Click test buttons to see results</div>
        </div>
    </div>
    
    <script>
        var supabaseClient;
        let currentSession = null;
        let currentUser = null;
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification' + (type === 'error' ? ' error' : '');
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 3000);
        }
        
        function updateNavbarForSession(session) {
            console.log('🔄 updateNavbarForSession called with:', session);
            
            const loginBtn = document.querySelector('.btn-login');
            const testResults = document.getElementById('testResults');
            
            if (!loginBtn) {
                testResults.innerHTML = `
                    <div class="error">❌ Login Button Not Found</div>
                    <p>Button with class .btn-login not found</p>
                `;
                return;
            }
            
            if (session?.user) {
                currentUser = session.user;
                currentSession = session;
                
                const provider = session.user.app_metadata?.provider || 'email';
                const email = session.user.email;
                const name = session.user.user_metadata?.name;
                
                if (provider === 'google') {
                    loginBtn.innerHTML = `
                        <div class="profile-container">
                            <span class="profile-email">${email}</span>
                            <span style="font-size: 12px; margin-left: 5px;">▼</span>
                        </div>
                    `;
                } else {
                    const firstLetter = (name || email.charAt(0) || 'U').toUpperCase();
                    loginBtn.innerHTML = `
                        <div class="profile-container">
                            <div class="profile-avatar">${firstLetter}</div>
                            <span style="font-size: 12px; margin-left: 5px;">▼</span>
                        </div>
                    `;
                }
                
                loginBtn.onclick = logout;
                loginBtn.classList.add('profile-button');
                
                testResults.innerHTML = `
                    <div class="success">✅ Profile Updated</div>
                    <p>Session: Active</p>
                    <p>User: ${email}</p>
                    <p>Provider: ${provider}</p>
                    <p>Button HTML: ${loginBtn.innerHTML.substring(0, 50)}...</p>
                    <p>Button Class: ${loginBtn.className}</p>
                    <p>Button Clickable: ${loginBtn.onclick !== null ? 'Yes' : 'No'}</p>
                `;
            } else {
                currentUser = null;
                currentSession = null;
                loginBtn.innerHTML = 'Login / Sign Up';
                loginBtn.onclick = openLoginSignup;
                loginBtn.classList.remove('profile-button');
                
                testResults.innerHTML = `
                    <div class="success">✅ Logged Out State</div>
                    <p>Button HTML: ${loginBtn.innerHTML}</p>
                    <p>Button Class: ${loginBtn.className}</p>
                    <p>Button Clickable: ${loginBtn.onclick !== null ? 'Yes' : 'No'}</p>
                `;
            }
        }
        
        function testDOMReady() {
            console.log('🧪 Testing DOM ready state...');
            
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                testResults.innerHTML = `
                    <div class="success">✅ DOM Ready</div>
                    <p>Button found: Yes</p>
                    <p>Button HTML: ${loginBtn.innerHTML}</p>
                    <p>Button Class: ${loginBtn.className}</p>
                    <p>Button Clickable: ${loginBtn.onclick !== null ? 'Yes' : 'No'}</p>
                `;
                
                // Test immediate update
                const mockSession = {
                    user: {
                        email: 'ready@example.com',
                        user_metadata: { name: 'Ready User' },
                        app_metadata: { provider: 'email' }
                    }
                };
                
                updateNavbarForSession(mockSession);
                
                setTimeout(() => {
                    const updatedBtn = document.querySelector('.btn-login');
                    if (updatedBtn && updatedBtn.innerHTML.includes('Ready User')) {
                        testResults.innerHTML = `
                            <div class="success">✅ Immediate Update Working</div>
                            <p>Profile updated immediately</p>
                            <p>Button HTML: ${updatedBtn.innerHTML}</p>
                        `;
                    } else {
                        testResults.innerHTML = `
                            <div class="error">❌ Immediate Update Failed</div>
                            <p>Button HTML: ${updatedBtn?.innerHTML || 'Not found'}</p>
                        `;
                    }
                }, 1000);
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>Button with class .btn-login not found</p>
                `;
            }
        }
        
        function testImmediateUpdate() {
            console.log('🔄 Testing immediate update...');
            
            const mockSession = {
                user: {
                    email: 'immediate@example.com',
                    user_metadata: { name: 'Immediate User' },
                    app_metadata: { provider: 'google' }
                }
            };
            
            updateNavbarForSession(mockSession);
            
            setTimeout(() => {
                const testResults = document.getElementById('testResults');
                const updatedBtn = document.querySelector('.btn-login');
                
                if (updatedBtn && updatedBtn.innerHTML.includes('Immediate User')) {
                    testResults.innerHTML = `
                        <div class="success">✅ Immediate Update Working</div>
                            <p>Google user profile displayed</p>
                            <p>Button HTML: ${updatedBtn.innerHTML}</p>
                        `;
                } else {
                    testResults.innerHTML = `
                        <div class="error">❌ Immediate Update Failed</div>
                            <p>Button HTML: ${updatedBtn?.innerHTML || 'Not found'}</p>
                        `;
                }
            }, 1000);
        }
        
        function testDelayedUpdate() {
            console.log('🔄 Testing delayed update...');
            
            setTimeout(() => {
                const mockSession = {
                    user: {
                        email: 'delayed@example.com',
                        user_metadata: { name: 'Delayed User' },
                        app_metadata: { provider: 'email' }
                    }
                };
                
                updateNavbarForSession(mockSession);
                
                setTimeout(() => {
                    const testResults = document.getElementById('testResults');
                    const updatedBtn = document.querySelector('.btn-login');
                    
                    if (updatedBtn && updatedBtn.innerHTML.includes('Delayed User')) {
                        testResults.innerHTML = `
                            <div class="success">✅ Delayed Update Working</div>
                            <p>Email user profile displayed</p>
                            <p>Button HTML: ${updatedBtn.innerHTML}</p>
                        `;
                    } else {
                        testResults.innerHTML = `
                            <div class="error">❌ Delayed Update Failed</div>
                            <p>Button HTML: ${updatedBtn?.innerHTML || 'Not found'}</p>
                        `;
                    }
                }, 1000);
            }, 2000);
        }
        
        function testButtonStatus() {
            console.log('🔄 Testing button status...');
            
            const testResults = document.getElementById('testResults');
            const loginBtn = document.querySelector('.btn-login');
            
            if (loginBtn) {
                testResults.innerHTML = `
                    <div class="success">✅ Button Status</div>
                    <p>Button found: Yes</p>
                    <p>Current HTML: ${loginBtn.innerHTML}</p>
                    <p>Current Class: ${loginBtn.className}</p>
                    <p>Click Handler: ${loginBtn.onclick !== null ? 'Set' : 'Not Set'}</p>
                    <p>Has Profile Class: ${loginBtn.classList.contains('profile-button') ? 'Yes' : 'No'}</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Button Not Found</div>
                    <p>Button with class .btn-login not found</p>
                `;
            }
        }
        
        // Initialize Supabase (for testing)
        function initializeSupabase() {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(
                    'https://qcyrfudyumcfdbcorcrc.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjeXJmdWR5dW1jZmRiY29yY3JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxODY1MTksImV4cCI6MjA4NTc2MjUxOX0.8vVy-pHB2dN_gZIXFqGSYjx9bAx6jAcDxKpPjCjADXs'
                );
                
                console.log('✅ Supabase initialized for testing');
            } else {
                console.error('❌ Supabase not loaded');
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 DOM Content Loaded');
            initializeSupabase();
        });
    </script>
</body>
</html>
