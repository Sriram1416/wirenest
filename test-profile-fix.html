<!DOCTYPE html>
<html>
<head>
    <title>Profile Fix Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .test-button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .status { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px; background: #4CAF50; color: white; border-radius: 5px; }
        
        /* Profile Styles */
        .profile-button {
            background: none;
            border: 1px solid #ddd;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        
        .profile-button:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .profile-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            border: 2px solid #ddd;
        }
        
        .profile-email {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        
        .test-results {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔧 Profile Display Fix Test</h1>
    
    <div class="test-section">
        <h2>🧪 Test Profile Display</h2>
        
        <div class="status">
            <h3>✅ Status: Testing Profile Display</h3>
            <p>Checking if profile button updates correctly...</p>
        </div>
        
        <h2>🧪 Test Functions</h2>
        
        <button class="test-button" onclick="testEmailLogin()">1. Test Email Login</button>
        <button class="test-button" onclick="testGoogleLogin()">2. Test Google Login</button>
        <button class="test-button" onclick="testLogout()">3. Test Logout</button>
        <button class="test-button" onclick="testProfileClick()">4. Test Profile Click</button>
        <button class="test-button" onclick="testManualUpdate()">5. Test Manual Update</button>
        
        <div id="testResults" class="test-results">
            <h3>📊 Test Results:</h3>
            <div id="results">Click test buttons to see results</div>
        </div>
    </div>
    
    <script>
        var supabaseClient;
        let currentSession = null;
        let currentUser = null;
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification' + (type === 'error' ? ' error' : '');
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 3000);
        }
        
        function updateNavbarForSession(session) {
            const loginBtn = document.querySelector('.btn-login');
            const profileInfo = document.getElementById('profileInfo');
            const resultsDiv = document.getElementById('results');
            
            if (!loginBtn) {
                resultsDiv.innerHTML = `
                    <div class="error">❌ Login Button Not Found</div>
                    <p>Button with class .btn-login not found</p>
                `;
                return;
            }
            
            if (session?.user) {
                currentUser = session.user;
                currentSession = session;
                
                const provider = session.user.app_metadata?.provider || 'email';
                const email = session.user.email;
                const name = session.user.user_metadata?.name;
                
                if (provider === 'google') {
                    loginBtn.innerHTML = `
                        <div class="profile-container">
                            <span class="profile-email">${email}</span>
                            <span style="font-size: 12px; margin-left: 5px;">▼</span>
                        </div>
                    `;
                    profileInfo.innerHTML = `
                        <div class="success">✅ Google User</div>
                        <p>Email: ${email}</p>
                    `;
                } else {
                    const firstLetter = (name || email.charAt(0) || 'U').toUpperCase();
                    loginBtn.innerHTML = `
                        <div class="profile-container">
                            <div class="profile-avatar">${firstLetter}</div>
                            <span style="font-size: 12px; margin-left: 5px;">▼</span>
                        </div>
                    `;
                    profileInfo.innerHTML = `
                        <div class="success">✅ Email User</div>
                        <p>Avatar: ${firstLetter}</p>
                    `;
                }
                
                loginBtn.onclick = logout;
                loginBtn.classList.add('profile-button');
                
                resultsDiv.innerHTML = `
                    <div class="success">✅ Profile Display Working</div>
                    <p>Session: Active</p>
                    <p>User: ${email || 'N/A'}</p>
                    <p>Provider: ${provider}</p>
                    <p>Button: Clickable (logout)</p>
                `;
            } else {
                currentUser = null;
                currentSession = null;
                loginBtn.innerHTML = 'Login / Sign Up';
                loginBtn.onclick = openLoginSignup;
                loginBtn.classList.remove('profile-button');
                
                resultsDiv.innerHTML = `
                    <div class="success">✅ Logged Out State Working</div>
                    <p>Button: Login / Sign Up</p>
                    <p>Click Handler: openLoginSignup</p>
                `;
            }
        }
        
        function testEmailLogin() {
            const mockSession = {
                user: {
                    email: 'test@example.com',
                    user_metadata: { name: 'Test User' },
                    app_metadata: { provider: 'email' }
                }
            };
            updateNavbarForSession(mockSession);
        }
        
        function testGoogleLogin() {
            const mockSession = {
                user: {
                    email: 'googleuser@gmail.com',
                    user_metadata: { name: 'Google User' },
                    app_metadata: { provider: 'google' }
                }
            };
            updateNavbarForSession(mockSession);
        }
        
        function testLogout() {
            console.log('🧪 Testing logout...');
            
            // Simulate logout function logic
            currentUser = null;
            currentSession = null;
            localStorage.removeItem('wirenestLoggedIn');
            localStorage.removeItem('wirenestEmail');
            localStorage.removeItem('wirenestName');
            
            // Update UI immediately
            updateNavbarForSession(null);
            
            alert('Logout test completed! Check if UI updated correctly.');
        }
        
        function testProfileClick() {
            const loginBtn = document.querySelector('.btn-login');
            if (loginBtn) {
                const btnText = loginBtn.innerHTML;
                const isClickable = loginBtn.onclick !== null;
                
                document.getElementById('results').innerHTML = `
                    <div class="success">✅ Profile Button Test</div>
                    <p>Button Text: ${btnText.substring(0, 50)}...</p>
                    <p>Clickable: ${isClickable ? 'Yes' : 'No'}</p>
                    <p>Has Profile Class: ${loginBtn.classList.contains('profile-button') ? 'Yes' : 'No'}</p>
                `;
            }
        }
        
        function testManualUpdate() {
            console.log('🔄 Testing manual update...');
            
            // Simulate manual session update
            const mockSession = {
                user: {
                    email: 'manual@example.com',
                    user_metadata: { name: 'Manual User' },
                    app_metadata: { provider: 'email' }
                }
            };
            
            currentUser = mockSession.user;
            currentSession = mockSession;
            localStorage.setItem('wirenestLoggedIn', 'true');
            localStorage.setItem('wirenestEmail', mockSession.user.email);
            localStorage.setItem('wirenestName', mockSession.user.user_metadata?.name);
            
            updateNavbarForSession(mockSession);
            
            setTimeout(() => {
                document.getElementById('results').innerHTML = `
                    <div class="success">✅ Manual Update Working</div>
                    <p>Profile: Updated correctly</p>
                    <p>Session: Active</p>
                    <p>Button: Clickable</p>
                `;
            }, 2000);
        }
        
        // Initialize Supabase (for testing)
        function initializeSupabase() {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(
                    'https://qcyrfudyumcfdbcorcrc.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjeXJmdWR5dW1jZmRiY29yY3JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxODY1MTksImV4cCI6MjA4NTc2MjUxOX0.8vVy-pHB2dN_gZIXFqGSYjx9bAx6jAcDxKpPjCjADXs'
                );
                
                console.log('✅ Supabase initialized for testing');
            } else {
                console.error('❌ Supabase not loaded');
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            initializeSupabase();
            updateNavbarForSession(currentSession);
        });
    </script>
</body>
</html>
