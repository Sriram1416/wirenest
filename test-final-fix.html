<!DOCTYPE html>
<html>
<head>
    <title>Final Fix Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .test-button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .status { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px; background: #4CAF50; color: white; border-radius: 5px; }
        
        /* Auth Modal Styles */
        .auth-modal {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.6);
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 9999;
        }

        .auth-modal.hidden {
          display: none;
        }

        .auth-card {
          background: white;
          padding: 30px;
          border-radius: 12px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.16);
          width: 90%;
          max-width: 400px;
          position: relative;
        }

        .auth-close {
          position: absolute;
          top: 15px;
          right: 15px;
          background: none;
          border: none;
          font-size: 24px;
          cursor: pointer;
          color: #666;
          width: 30px;
          height: 30px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 50%;
          transition: all 0.3s ease;
        }

        .auth-close:hover {
          background: #f0f0f0;
          color: #333;
        }

        .auth-card input {
          width: 100%;
          padding: 12px 16px;
          margin-bottom: 16px;
          border: 1px solid #ddd;
          border-radius: 6px;
          font-size: 16px;
          transition: all 0.3s ease;
          box-sizing: border-box;
        }

        .auth-card input:focus {
          outline: none;
          border-color: #007bff;
          box-shadow: 0 0 0 3px rgba(26, 61, 99, 0.1);
        }

        .auth-card button {
          width: 100%;
          padding: 14px 16px;
          background: #007bff;
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
          margin-bottom: 16px;
        }

        .auth-card button:hover {
          background: #0056b3;
          transform: translateY(-1px);
        }

        .auth-card hr {
          border: none;
          border-top: 1px solid #ddd;
          margin: 20px 0;
        }
        
        .test-results {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔧 Final Fix Test</h1>
    
    <div class="test-section">
        <h2>🧪 Test Final Fix</h2>
        
        <div class="status">
            <h3>✅ Status: Testing Final Fix</h3>
            <p>Checking if login/signup modal works correctly...</p>
        </div>
        
        <h2>🧪 Test Functions</h2>
        
        <button class="test-button" onclick="testOpenModal()">1. Test Open Modal</button>
        <button class="test-button" onclick="testCloseModal()">2. Test Close Modal</button>
        <button class="test-button" onclick="testLogin()">3. Test Login</button>
        <button class="test-button" onclick="testSignup()">4. Test Signup</button>
        <button class="test-button" onclick="testConsole()">5. Test Console</button>
        
        <div id="testResults" class="test-results">
            <h3>📊 Test Results:</h3>
            <div id="results">Click test buttons to see results</div>
        </div>
    </div>
    
    <!-- Login/Signup Modal -->
    <div id="loginSignupModal" class="auth-modal hidden">
      <div class="auth-card">
        <button class="auth-close" onclick="closeLoginSignup()">×</button>

        <!-- Signup -->
        <input id="signupName" type="text" placeholder="Full Name">
        <input id="signupEmail" type="email" placeholder="Email">
        <input id="signupPassword" type="password" placeholder="Password">
        <button onclick="handleSignup()">Create Account</button>

        <hr>

        <!-- Login -->
        <input id="loginEmail" type="email" placeholder="Email">
        <input id="loginPassword" type="password" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
      </div>
    </div>
    
    <script>
        var supabaseClient;
        let currentSession = null;
        let currentUser = null;
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification' + (type === 'error' ? ' error' : '');
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 3000);
        }
        
        function testOpenModal() {
            const modal = document.getElementById('loginSignupModal');
            const testResults = document.getElementById('testResults');
            
            if (modal) {
                modal.classList.remove('hidden');
                testResults.innerHTML = `
                    <div class="success">✅ Modal Opened</div>
                    <p>Modal is visible</p>
                    <p>Hidden class removed</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Modal Not Found</div>
                    <p>Modal element not found</p>
                `;
            }
        }
        
        function testCloseModal() {
            const modal = document.getElementById('loginSignupModal');
            const testResults = document.getElementById('testResults');
            
            if (modal) {
                modal.classList.add('hidden');
                testResults.innerHTML = `
                    <div class="success">✅ Modal Closed</div>
                    <p>Modal is hidden</p>
                    <p>Hidden class added</p>
                `;
            } else {
                testResults.innerHTML = `
                    <div class="error">❌ Modal Not Found</div>
                    <p>Modal element not found</p>
                `;
            }
        }
        
        function testLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const testResults = document.getElementById('testResults');
            
            if (!email || !password) {
                testResults.innerHTML = `
                    <div class="error">❌ Login Test Failed</div>
                    <p>Missing email or password</p>
                `;
                return;
            }
            
            testResults.innerHTML = `
                <div class="success">✅ Login Test Working</div>
                <p>Email: ${email}</p>
                <p>Password: ${'*'.repeat(password.length)}</p>
                <p>Input fields found and working</p>
            `;
        }
        
        function testSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const testResults = document.getElementById('testResults');
            
            if (!name || !email || !password) {
                testResults.innerHTML = `
                    <div class="error">❌ Signup Test Failed</div>
                    <p>Missing fields</p>
                `;
                return;
            }
            
            if (password.length < 6) {
                testResults.innerHTML = `
                    <div class="error">❌ Signup Test Failed</div>
                    <p>Password too short (min 6 chars)</p>
                `;
                return;
            }
            
            const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
            if (!emailRegex.test(email)) {
                testResults.innerHTML = `
                    <div class="error">❌ Signup Test Failed</div>
                    <p>Invalid email format</p>
                `;
                return;
            }
            
            testResults.innerHTML = `
                <div class="success">✅ Signup Test Working</div>
                <p>Name: ${name}</p>
                <p>Email: ${email}</p>
                <p>Password: ${'*'.repeat(password.length)}</p>
                <p>Input fields found and working</p>
            `;
        }
        
        function testConsole() {
            const testResults = document.getElementById('testResults');
            
            testResults.innerHTML = `
                <div class="success">✅ Console Working</div>
                <p>Check console for function calls</p>
                <p>Open DevTools → Console</p>
                <p>Run: openLoginSignup()</p>
                <p>Expected: Modal opens</p>
            `;
        }
        
        // Global functions for modal (outside DOMContentLoaded)
        window.openLoginSignup = function () {
          const modal = document.getElementById("loginSignupModal");
          if (!modal) {
            console.error("Login modal not found");
            return;
          }
          modal.classList.remove("hidden");
        };

        window.closeLoginSignup = function () {
          const modal = document.getElementById("loginSignupModal");
          if (!modal) return;
          modal.classList.add("hidden");
        };
        
        // Mock functions for testing
        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showNotification('Please enter email and password');
                return;
            }
            
            showNotification('Login test successful!');
            console.log('Login test passed:', { email, password: '***' });
        }
        
        function handleSignup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            
            if (!name || !email || !password) {
                showNotification('Please fill in all fields');
                return;
            }
            
            if (password.length < 6) {
                showNotification('Password must be at least 6 characters');
                return;
            }
            
            const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
            if (!emailRegex.test(email)) {
                showNotification('Please enter a valid email address');
                return;
            }
            
            showNotification('Signup test successful!');
            console.log('Signup test passed:', { name, email, password: '***' });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 DOM Content Loaded');
            console.log('✅ Final fix test ready');
            console.log('🧪 Test functions available');
        });
    </script>
</body>
</html>
