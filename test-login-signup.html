<!DOCTYPE html>
<html>
<head>
    <title>Login/Signup Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .test-button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .status { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px; background: #4CAF50; color: white; border-radius: 5px; }
        
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; margin: 5px 0; }
        
        .test-results {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔐 Login/Signup Test</h1>
    
    <div class="test-section">
        <h2>🧪 Test Login/Signup Functions</h2>
        
        <div class="status">
            <h3>✅ Status: Testing Login/Signup</h3>
            <p>Checking if login/signup functions work correctly...</p>
        </div>
        
        <h2>🧪 Test Functions</h2>
        
        <button class="test-button" onclick="testOpenModal()">1. Test Open Modal</button>
        <button class="test-button" onclick="testCloseModal()">2. Test Close Modal</button>
        <button class="test-button" onclick="testLoginTab()">3. Test Login Tab</button>
        <button class="test-button" onclick="testSignupTab()">4. Test Signup Tab</button>
        <button class="test-button" onclick="testLoginSubmit()">5. Test Login Submit</button>
        <button class="test-button" onclick="testSignupSubmit()">6. Test Signup Submit</button>
        
        <div id="testResults" class="test-results">
            <h3>📊 Test Results:</h3>
            <div id="results">Click test buttons to see results</div>
        </div>
    </div>
    
    <!-- Login/Signup Modal -->
    <div id="loginSignupOverlay" class="login-overlay">
        <div class="login-panel">
            <button class="close-login" onclick="closeLoginSignup()">×</button>
            
            <!-- Tab Navigation -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showLoginTab()">Login</button>
                <button class="auth-tab" onclick="showSignupTab()">Sign Up</button>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <button type="button" class="btn-secondary" onclick="loginWithGoogle()" style="margin-top: 10px; width: 100%;">
                    Continue with Google
                </button>
            </form>
            
            <!-- Signup Form -->
            <form id="signupForm" onsubmit="handleSignup(event)" style="display: none;">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
                <button type="button" class="btn-secondary" onclick="loginWithGoogle()" style="margin-top: 10px; width: 100%;">
                    Continue with Google
                </button>
            </form>
        </div>
    </div>
    
    <script>
        var supabaseClient;
        let currentSession = null;
        let currentUser = null;
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification' + (type === 'error' ? ' error' : '');
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 3000);
        }
        
        function testOpenModal() {
            const overlay = document.getElementById('loginSignupOverlay');
            const results = document.getElementById('testResults');
            
            if (overlay) {
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                results.innerHTML = `
                    <div class="success">✅ Modal Opened</div>
                    <p>Overlay is visible</p>
                    <p>Body overflow: hidden</p>
                `;
            } else {
                results.innerHTML = `
                    <div class="error">❌ Modal Not Found</div>
                    <p>Overlay element not found</p>
                `;
            }
        }
        
        function testCloseModal() {
            const overlay = document.getElementById('loginSignupOverlay');
            const results = document.getElementById('testResults');
            
            if (overlay) {
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
                results.innerHTML = `
                    <div class="success">✅ Modal Closed</div>
                    <p>Overlay is hidden</p>
                    <p>Body overflow: auto</p>
                `;
            } else {
                results.innerHTML = `
                    <div class="error">❌ Modal Not Found</div>
                    <p>Overlay element not found</p>
                `;
            }
        }
        
        function testLoginTab() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTab = document.querySelector('.auth-tab.active');
            const results = document.getElementById('testResults');
            
            if (loginForm && signupForm && loginTab) {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                
                // Update tab states
                const tabs = document.querySelectorAll('.auth-tab');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
                
                results.innerHTML = `
                    <div class="success">✅ Login Tab Active</div>
                    <p>Login form: ${loginForm.style.display}</p>
                    <p>Signup form: ${signupForm.style.display}</p>
                    <p>Active tab: ${loginTab.textContent}</p>
                `;
            } else {
                results.innerHTML = `
                    <div class="error">❌ Elements Not Found</div>
                    <p>Login form: ${loginForm?.style?.display || 'Not found'}</p>
                    <p>Signup form: ${signupForm?.style?.display || 'Not found'}</p>
                `;
            }
        }
        
        function testSignupTab() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const signupTab = document.querySelectorAll('.auth-tab')[1];
            const results = document.getElementById('testResults');
            
            if (loginForm && signupForm && signupTab) {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                
                // Update tab states
                const tabs = document.querySelectorAll('.auth-tab');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
                
                results.innerHTML = `
                    <div class="success">✅ Signup Tab Active</div>
                    <p>Login form: ${loginForm.style.display}</p>
                    <p>Signup form: ${signupForm.style.display}</p>
                    <p>Active tab: ${signupTab.textContent}</p>
                `;
            } else {
                results.innerHTML = `
                    <div class="error">❌ Elements Not Found</div>
                    <p>Login form: ${loginForm?.style?.display || 'Not found'}</p>
                    <p>Signup form: ${signupForm?.style?.display || 'Not found'}</p>
                `;
            }
        }
        
        function testLoginSubmit() {
            const results = document.getElementById('testResults');
            const loginForm = document.getElementById('loginForm');
            
            if (loginForm) {
                results.innerHTML = `
                    <div class="success">✅ Login Form Ready</div>
                    <p>Form found: Yes</p>
                    <p>Submit handler: ${loginForm.onsubmit ? 'Set' : 'Not Set'}</p>
                    <p>Form action: ${loginForm.action || 'Not set'}</p>
                    <p>Form method: ${loginForm.method || 'Not set'}</p>
                `;
            } else {
                results.innerHTML = `
                    <div class="error">❌ Login Form Not Found</div>
                    <p>Form not found</p>
                `;
            }
        }
        
        function testSignupSubmit() {
            const results = document.getElementById('testResults');
            const signupForm = document.getElementById('signupForm');
            
            if (signupForm) {
                results.innerHTML = `
                    <div class="success">✅ Signup Form Ready</div>
                    <p>Form found: Yes</p>
                    <p>Submit handler: ${signupForm.onsubmit ? 'Set' : 'Not Set'}</p>
                    <p>Form action: ${signupForm.action || 'Not set'}</p>
                    <p>Form method: ${signupForm.method || 'Not set'}</p>
                `;
            } else {
                results.innerHTML = `
                    <div class="error">❌ Signup Form Not Found</div>
                    <p>Form not found</p>
                `;
            }
        }
        
        // Mock functions for testing
        function openLoginSignup() {
            const overlay = document.getElementById('loginSignupOverlay');
            if (overlay) {
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                console.log('✅ Modal opened');
            } else {
                console.error('❌ Modal not found');
            }
        }
        
        function closeLoginSignup() {
            const overlay = document.getElementById('loginSignupOverlay');
            if (overlay) {
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
                console.log('✅ Modal closed');
            } else {
                console.error('❌ Modal not found');
            }
        }
        
        function showLoginTab() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabs = document.querySelectorAll('.auth-tab');
            
            if (loginForm && signupForm && tabs.length === 2) {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            }
        }
        
        function showSignupTab() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabs = document.querySelectorAll('.auth-tab');
            
            if (loginForm && signupForm && tabs.length === 2) {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }
        
        function handleLogin(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const email = formData.get('email');
            const password = formData.get('password');
            
            const results = document.getElementById('testResults');
            
            if (!email || !password) {
                results.innerHTML = `
                    <div class="error">❌ Login Failed</div>
                    <p>Missing email or password</p>
                `;
                return;
            }
            
            results.innerHTML = `
                <div class="success">✅ Login Submitted</div>
                    <p>Email: ${email}</p>
                    <p>Password: ${'*'.repeat(password.length)}</p>
                    <p>Form submitted successfully</p>
                `;
            
            // Reset form
            event.target.reset();
        }
        
        function handleSignup(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const name = formData.get('name');
            const email = formData.get('email');
            const password = formData.get('password');
            
            const results = document.getElementById('testResults');
            
            if (!name || !email || !password) {
                results.innerHTML = `
                    <div class="error">❌ Signup Failed</div>
                    <p>Missing fields</p>
                `;
                return;
            }
            
            if (password.length < 6) {
                results.innerHTML = `
                    <div class="error">❌ Signup Failed</div>
                    <p>Password too short (min 6 chars)</p>
                `;
                return;
            }
            
            const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
            if (!emailRegex.test(email)) {
                results.innerHTML = `
                    <div class="error">❌ Signup Failed</div>
                    <p>Invalid email format</p>
                `;
                return;
            }
            
            results.innerHTML = `
                <div class="success">✅ Signup Submitted</div>
                    <p>Name: ${name}</p>
                    <p>Email: ${email}</p>
                    <p>Password: ${'*'.repeat(password.length)}</p>
                    <p>Form submitted successfully</p>
                `;
            
            // Reset form
            event.target.reset();
        }
        
        function loginWithGoogle() {
            console.log('🔄 Google login initiated');
            const results = document.getElementById('testResults');
            
            results.innerHTML = `
                <div class="success">✅ Google Login</div>
                    <p>Redirecting to Google...</p>
                `;
        }
    </script>
</body>
</html>
